version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22 && nvm alias default 22
        - node -v && npm -v
    build:
      commands:
        # npm ci falla con las dependencias empaquetadas (inBundle) de @aws-amplify/data-construct;
        # npm install respeta el lockfile sin esa validación.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || (nvm install 22 && nvm use 22)
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
